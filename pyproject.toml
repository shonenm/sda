[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sda"
version = "0.0.1"
description = "Submodule package for SDA experiments"
readme = "README.md"
requires-python = ">=3.10"
# Dependencies are managed in the root pyproject.toml
dependencies = []

[tool.setuptools]
packages = ["sda"]
